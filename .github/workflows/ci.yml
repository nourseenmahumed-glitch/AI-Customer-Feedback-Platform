name: CI Pipeline

on:
  push:
    branches:
      - main
      - member5-devops

  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Project Structure
        run: |
          pwd
          ls -la
          find . -maxdepth 2 -type d

      - name: Check docker-compose file
        run: |
          test -f docker-compose.yml
          echo "✅ docker-compose.yml found"

      - name: Check Required Folders
        run: |
          test -d backend
          test -d database
          test -d deployment
          test -d notebooks
          test -d scripts
          echo "✅ Required folders found"

      - name: Finish
        run: echo "🚀 CI Passed Successfully"